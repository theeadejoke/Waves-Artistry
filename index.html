<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Waves Artistry Beauty Therapy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e4;--sf:#fbf3e4;--tx:#8a3556;--mu:#b8798f;--gd:#d4789a;--ln:#ecd6cc;--er:#a33a2f;--ok:#3d6b45;--ink:#c2547a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:300 16px/1.7 Jost,system-ui,sans-serif;letter-spacing:.01em}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;line-height:1.08;margin:0 0 .6em;letter-spacing:-.01em}h1{font-size:clamp(2.8rem,8vw,5.2rem)}h2{font-size:2.1rem}h3{font-size:1.35rem}
a{color:inherit}.w{max-width:960px;margin:0 auto;padding:0 24px}
header.t{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 24px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--ln)}
header.t img{height:38px;width:38px}header.t strong{font:400 1.05rem 'Cormorant Garamond',serif!important;letter-spacing:.04em;line-height:1.2}header.t nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:6px 10px;text-decoration:none;font-size:.92rem;color:var(--mu)}nav a.on,nav a:hover{color:var(--tx);box-shadow:inset 0 -1px var(--gd)}
.b{display:inline-block;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:0;padding:12px 26px;font:400 .95rem Jost,sans-serif;letter-spacing:.04em;cursor:pointer;text-decoration:none}
.b.o{background:none;color:var(--tx);border-color:var(--ln)}.b.o:hover{border-color:var(--tx)}.b.s{padding:6px 14px;font-size:.85rem}.b:disabled{opacity:.4}
.hero{padding:96px 0 72px;display:grid;gap:40px;grid-template-columns:1fr;align-items:center}.hero img{width:min(150px,40vw);justify-self:center;opacity:.9}.hero p{max-width:30ch;font-size:1.1rem}
@media(min-width:760px){.hero{grid-template-columns:1.6fr 1fr}}
.g{display:grid;gap:36px 28px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.c{background:none;border:0;border-top:1px solid var(--ln);padding:16px 0 0;border-radius:0}.mu{color:var(--mu)}.pr{color:var(--gd)}
section{padding:40px 0}footer{border-top:1px solid var(--ln);padding:28px 0;margin-top:48px;color:var(--mu);font-size:.85rem}
label{display:block;font-size:.82rem;margin:14px 0 4px;color:var(--mu)}
input,select,textarea{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:none;color:var(--tx);font:inherit}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--tx)}
input[type=checkbox]{width:auto;margin-right:8px}.row{display:flex;gap:18px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.sl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.sl button{padding:8px 14px;border:1px solid var(--ln);background:none;color:var(--tx);border-radius:0;cursor:pointer;font:inherit}.sl button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dash{display:grid;gap:28px;padding-top:28px}@media(min-width:800px){.dash{grid-template-columns:160px 1fr}}
.side{display:flex;gap:2px;flex-wrap:wrap}@media(min-width:800px){.side{flex-direction:column;flex-wrap:nowrap}}
.side button{background:none;border:0;border-left:1px solid var(--ln);text-align:left;padding:8px 14px;color:var(--mu);font:inherit;cursor:pointer}.side button.on{color:var(--tx);border-color:var(--gd)}
.kp{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:20px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}.kp .c{border:0;padding:16px 12px 16px 0}.kp .c b{display:block;font:400 1.8rem 'Cormorant Garamond',serif}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th{font-weight:400;color:var(--mu)}th,td{padding:10px 12px 10px 0;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}tr.k{cursor:pointer}tr.k:hover td{background:#8881}
.tg{font-size:.8rem;color:var(--mu)}.paid,.completed,.confirmed{color:var(--ok)}.unpaid,.cancelled,.noshow{color:var(--er)}
.bk{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px;z-index:20}.md{background:var(--bg);width:min(660px,100%);padding:28px;border:1px solid var(--ln)}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;z-index:30;display:none;max-width:90vw}#t.er{background:var(--er);color:#fff}
.nt{border-left:1px solid var(--gd);padding:4px 14px;margin:14px 0;font-size:.9rem;color:var(--mu)}
</style></head><body>

let db=null,user=null,staff=false,uidv='',S={svc:[],cus:[],tx:[],ap:[],cfg:{}},V='home',tab='ov',D=td(),Q='',F='',B={},L=[],busy=false,R={a:td().slice(0,8)+'01',b:td()};

async function init(){
 try{if(window.claude){user=await claude.use('user');db=await claude.use('db')}}catch(x){}
 try{if(user){staff=(await user.canEdit())||(await user.can('data.write'))===true;uidv=await user.id()}}catch(x){}

 onhashchange();}

 const a=['home','services','book','contact'],isD=V==='app';

 ${f.length?`<section><h2>Popular services</h2><div class="g">${f.map(card).join('')}</div></section>`:''}
 ${cats.length?`<section><h2>Categories</h2><div class="row">${cats.map(c=>`<a class="b o s" href="#services">${E(c)}</a>`).join('')}</div></section>`:''}

function rpV(){const a=S.tx.filter(x=>x.date>=R.a&&x.date<=R.b),t=tot(a),bs={},bc={};a.forEach(x=>x.lines.forEach(l=>{bs[l.name]=bs[l.name]||{q:0,r:0};bs[l.name].q+=l.q;bs[l.name].r+=l.total;bc[l.cat]=(bc[l.cat]||0)+l.total}));
 const ap={};S.ap.filter(x=>x.date>=R.a&&x.date<=R.b).forEach(x=>ap[x.status]=(ap[x.status]||0)+1);
 return `<h2>Reports</h2><div class="row" style="align-items:end"><div><label>From</label><input type="date" value="${R.a}" onchange="R.a=this.value;draw()"></div><div><label>To</label><input type="date" value="${R.b}" onchange="R.b=this.value;draw()"></div><div><button class="b o" onclick="csv()">Export CSV</button></div></div>${kp([['Transactions',t.n],['Service charges',N(t.ch)],['Payments received',N(t.pd)],['Outstanding',N(t.bal)]])}<p class="mu">Charges are not profit; no expenses are tracked.</p><h3>By service</h3><div class="tb"><table><tr><th>Service</th><th>Times</th><th>Charged</th></tr>${Object.entries(bs).sort((x,y)=>y[1].r-x[1].r).map(([k,v])=>`<tr><td>${E(k)}</td><td>${v.q}</td><td>${N(v.r)}</td></tr>`).join('')}</table></div><h3>By category</h3><div class="tb"><table>${Object.entries(bc).map(([k,v])=>`<tr><td>${E(k)}</td><td>${N(v)}</td></tr>`).join('')}</table></div><p>Appointments: ${Object.entries(ap).map(([k,v])=>k+' '+v).join(' · ')||'none'} · New customers: ${S.cus.filter(c=>c.reg>=R.a&&c.reg<=R.b).length}</p>`}
async function csv(){const d=await claude.use('downloads');if(!d)return toast('Downloads are not available here.',1);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const r=[['Date','Customer','Services','Charged','Paid','Outstanding','Status','Method','Staff'].map(q).join(',')];S.tx.filter(x=>x.date>=R.a&&x.date<=R.b).forEach(x=>r.push([x.date,x.cname,x.lines.map(l=>l.name).join('; '),x.total,x.paid,x.bal,x.status,x.method,x.staff].map(q).join(',')));
 try{await d.save({filename:`waves-records-${R.a}-to-${R.b}.csv`,data:r.join('\n')})}catch(e){}}
function stV(){const c=cfg(),f=(k,l,p)=>`<label>${l}</label><input id="s_${k}" value="${E(c[k]||'')}" placeholder="${p||''}">`;
 return `<h2>Business Settings</h2><div style="max-width:520px">${f('phone','Phone')}${f('whatsapp','WhatsApp number (with country code)','234…')}${f('email','Email')}${f('address','Address')}${f('hours','Opening hours (shown on site)','Mon–Sat 9am–6pm')}${f('insta','Instagram link')}<div class="row"><div><label>Booking opens</label><input type="time" id="s_open" value="${c.open||'09:00'}"></div><div><label>Booking closes</label><input type="time" id="s_close" value="${c.close||'18:00'}"></div></div>${f('methods','Payment methods (comma separated)','Cash, Bank transfer, Card, Other')}<p><button class="b" onclick="stSave()">Save settings</button></p><div class="nt">Email delivery and email campaigns are not set up yet, so no emails are sent.</div></div>`}
async function stSave(){const o={};['phone','whatsapp','email','address','hours','insta','open','close','methods'].forEach(k=>o[k]=$('#s_'+k).value.trim());try{await db.doc('cfg/biz').set(o);toast('Settings saved.')}catch(e){toast('Could not save settings.',1)}}
init();
</script></body></html>
